name: Jellyfin Sync
description: Refresh the exact Jellyfin item linked in a Stash scene URL. No title, filename, path, date, or performer search is used.
version: 0.3.0
url: https://example.invalid/jellyfin-sync
exec:
  - python3
  - "{pluginDir}/JellyfinSync.py"
interface: raw
settings:
  jellyfinBaseUrl:
    displayName: Jellyfin base URL
    description: "Example: http://192.168.1.201:3096 (no trailing slash)"
    type: STRING
  jellyfinApiKey:
    displayName: Jellyfin API key
    description: Jellyfin API key (Dashboard -> API Keys).
    type: STRING
  verifyTls:
    displayName: Verify TLS certificates
    description: Enable for a valid HTTPS certificate. Disable for local/self-signed HTTPS.
    type: BOOLEAN
  skipUnorganized:
    displayName: Process only organized scenes
    description: "If enabled, scenes with Organized=false are ignored."
    type: BOOLEAN
hooks:
  - name: Scene update
    description: Refresh the Jellyfin item referenced by a URL in the updated Stash scene
    triggeredBy:
      - Scene.Update.Post
