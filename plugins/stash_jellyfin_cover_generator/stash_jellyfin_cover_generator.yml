name: Jellyfin Cover Generator
description: "Jellyfin Cover Generator."
version: "0.2.3"
interface: raw
exec:
  - python3
  - "{pluginDir}/stash_jellyfin_cover_generator.py"
errLog: error

settings:
  jellyfin_url:
    displayName: Jellyfin URL
    description: Base URL of Jellyfin server, for example http://192.168.1.201:8096
    type: STRING
  jellyfin_api_key:
    displayName: Jellyfin API key
    description: Jellyfin Dashboard -> Advanced -> API Keys
    type: STRING
  jellyfin_user_id:
    displayName: Jellyfin user id (optional)
    description: Optional. Improves Jellyfin search endpoints. Leave empty if unsure.
    type: STRING
  update_on_scene_update:
    displayName: Generate on scene create/update
    description: If enabled, the plugin runs automatically on Scene.Create.Post and Scene.Update.Post hooks. If disabled, hooks are skipped and only manual task works.
    type: BOOLEAN
  skip_unorganized:
    displayName: Skip unorganized scenes
    description: If enabled, scenes where Organized=false are skipped.
    type: BOOLEAN
  include_library_paths:
    displayName: Allowed library paths
    description: "Optional. Only generate covers for scenes whose primary file path starts with one of these prefixes. Enter one path per line, or separate multiple paths with commas. Example: /data/tvshow"
    type: STRING
  exclude_library_paths:
    displayName: Excluded library paths
    description: "Optional. Skip scenes whose primary file path starts with one of these prefixes. Enter one path per line, or separate multiple paths with commas. Example: /data/pmov"
    type: STRING
  path_rewrite_from:
    displayName: Path rewrite from (optional)
    description: Prefix of the Stash media path, if Jellyfin sees the same files under a different path.
    type: STRING
  path_rewrite_to:
    displayName: Path rewrite to (optional)
    description: Replacement prefix for Jellyfin path matching.
    type: STRING
  poster_width:
    displayName: Poster width
    description: Output poster width in pixels. Default 800.
    type: NUMBER
  poster_height:
    displayName: Poster height
    description: Output poster height in pixels. Default 1200.
    type: NUMBER
  logo_width_percent:
    displayName: Studio logo width percent
    description: Logo width relative to generated poster width. Default 50, so 800px poster width gives a 400px logo.
    type: NUMBER
  logo_padding_percent:
    displayName: Studio logo padding percent
    description: Right/bottom padding relative to generated poster width. Default 3.
    type: NUMBER
  logo_trim_transparent_padding:
    displayName: Trim transparent logo padding
    description: Crops transparent borders around PNG logos before resizing. Helps when the actual logo is tiny inside a large transparent canvas. Default false.
    type: BOOLEAN
  logo_visibility_boost:
    displayName: Logo visibility boost
    description: Adds subtle light/dark glow around transparent logos so black or white logos remain visible on different poster backgrounds. Default false.
    type: BOOLEAN
  logo_background_opacity:
    displayName: Logo background opacity
    description: Optional dark contrast plate behind logo, from 0 to 180. Default 0 means disabled. Use 35-70 if some logos are still hard to see.
    type: NUMBER
  use_studio_name_when_logo_missing:
    displayName: Use studio name when logo is missing
    description: If the studio has no usable image/logo, generate a text logo from the studio name instead of leaving the poster unmarked. Default false.
    type: BOOLEAN
  image_quality:
    displayName: JPEG quality
    description: JPEG quality for Jellyfin upload. Default 92.
    type: NUMBER
  save_debug_copy:
    displayName: Save generated copy locally
    description: Saves generated posters into pluginDir/generated for visual checking.
    type: BOOLEAN
  dry_run:
    displayName: Dry run
    description: Generate and resolve everything, but do not upload to Jellyfin.
    type: BOOLEAN
  jellyfin_upload_delay_seconds:
    displayName: Jellyfin upload delay seconds
    description: Wait this many seconds before uploading a freshly generated poster or a generated-folder image to Jellyfin. Helps when immediate updates are sometimes missed. Default 2.
    type: NUMBER
  generated_folder:
    displayName: Generated folder override
    description: Optional. Leave empty to use pluginDir/generated. Can be absolute or relative to the plugin folder.
    type: STRING
  generated_upload_limit:
    displayName: Generated upload limit
    description: Optional safety limit for manual generated-folder upload. 0 means no limit.
    type: NUMBER

tasks:
  - name: Generate Jellyfin cover for scene
    description: Manual run. Edit scene_id in defaultArgs or run from a hook.
    defaultArgs:
      scene_id: ""

  - name: Upload generated covers to Jellyfin
    description: Manual bulk run. Scans pluginDir/generated for scene_<id>.jpg/png/webp and replaces the matching Jellyfin Primary images.
    defaultArgs:
      upload_generated_to_jellyfin: true

hooks:
  - name: Generate Jellyfin cover on scene create/update
    description: Runs when a scene is created/updated if update_on_scene_update is enabled.
    triggeredBy:
      - Scene.Create.Post
      - Scene.Update.Post
